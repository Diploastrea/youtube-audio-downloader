spring:
  application:
    name: yt-audio-downloader
  threads:
    virtual:
      enabled: true
  output:
    ansi:
      enabled: ALWAYS

logging:
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
    level: "%5p [%t]"
  level:
    com.yt.dl.ytaudiodownloader: info

app:
  config:
    playlist: https://www.youtube.com/playlist?list=PLXojoHzF3FgxstjM48QGzZsqJHTNpl8rb
    output: download
    remove-after-download: false
